name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-26.04

    # Backend test DB on localhost:5432, matching apps/backend/.env.test (committed, test-only values)
    services:
      postgres:
        image: postgres:18.6-alpine # same as docker-compose.yml
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fisio_app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user -d fisio_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false # pnpm is enabled below and its store is cached by hand
      - run: corepack enable

      # Persist the pnpm store between runs (key = lockfile hash)
      - run: echo "PNPM_STORE=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # 1. Lint & format: fast, no build needed, fail early
      - run: pnpm -r --if-present lint
      - run: pnpm -r --if-present fmt:check

      # 2. Build = type check (tsc / tsc -b) + bundle, in dependency order (validators → backend → FEs)
      - run: pnpm -F client-app... -F professional-app... build

      # 3. Backend type-aware lint + type check (oxlint + tsgolint). Runs after the build
      #    because @fisio-app/validators resolves to its dist/ output.
      - run: pnpm -F @fisio-app/backend typecheck

      # 4. Backend tests: create the schema in the empty service DB, then run Vitest
      - run: pnpm -F @fisio-app/backend db:push:test
      - run: pnpm -F @fisio-app/backend test
