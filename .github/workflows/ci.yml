name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-26.04
    container:
      image: node:24

    # No env needed: lint, format and build never read secrets or connect to a DB.
    # Add an env block with test-only values when backend tests are wired in.
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable

      # Persist the pnpm store between runs (key = lockfile hash)
      - run: echo "PNPM_STORE=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # 1. Lint & format: fast, no build needed, fail early
      - run: pnpm -r --if-present lint
      - run: pnpm -r --if-present fmt:check

      # 2. Build = type check (tsc / tsc -b) + bundle, in dependency order (validators → backend → FEs)
      - run: pnpm -F client-app... -F professional-app... build

      # 3. Backend type-aware lint + type check (oxlint + tsgolint). Runs after the build
      #    because @fisio-app/validators resolves to its dist/ output.
      - run: pnpm -F @fisio-app/backend typecheck

  # Runs on the runner host (not in a container) so Postgres is reachable on localhost,
  # matching apps/backend/.env.test, which Playwright uses to boot the backend.
  e2e:
    # Playwright 1.59 cannot install browsers on ubuntu-26.04 yet
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fisio_app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The backend imports @fisio-app/validators from its dist
      - run: pnpm -F @fisio-app/validators build
      - run: pnpm -F @fisio-app/backend db:push --force
        env:
          DATABASE_URL: postgres://user:password@localhost:5432/fisio_app_test
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
