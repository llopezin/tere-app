services:
  db:
    image: postgres:18.6-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Back up and migrate existing PostgreSQL 16 data before starting this PostgreSQL 18 image.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3000:3000" 
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - PORT=3000
      - NODE_ENV=${NODE_ENV}
      # FRONTEND_URL is deprecated: CLIENT_APP_URL falls back to it so existing deploys keep working
      - FRONTEND_URL=${FRONTEND_URL}
      - CLIENT_APP_URL=${CLIENT_APP_URL:-}
      - PROFESSIONAL_APP_URL=${PROFESSIONAL_APP_URL:-}
    depends_on:
      db:
        condition: service_healthy

  client-app:
    build:
      context: .
      dockerfile: apps/client-app/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "8080:8080"

volumes:
  postgres_data: